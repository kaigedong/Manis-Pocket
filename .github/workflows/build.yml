name: Build and Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches: [master, feat/p2p-sync, refactor/rust-shared-core]
    tags: ['v*']
    # A docs-only push must not queue another full macOS + Android release
    # build: master pushes never cancel each other, so every one of them would
    # serialize behind the previous release and produce its own version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: Resolve shared release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release metadata
        run: python3 -m unittest discover -s scripts/tests -v
      - id: version
        name: Determine version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/release-version.py \
            --ref "$GITHUB_REF" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build Manis Pocket (macOS)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - name: Test
        run: |
          cargo test -p manis-pocket-app
          cargo test -p manis-pocket-core

      - name: Build and package
        env:
          PROFILE: release
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          # Falls back to an ad-hoc signature when the certificate is absent, so
          # forks still produce a runnable app.
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: bash scripts/bundle-macos.sh

      - name: Verify and package
        run: |
          APP="build/Manis Pocket.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1

          ditto -c -k --sequesterRsrc --keepParent "$APP" build/ManisPocket.app.zip

          VERIFY_DIR="$(mktemp -d)"
          ditto -x -k build/ManisPocket.app.zip "$VERIFY_DIR"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/Manis Pocket.app"
          test -x "$VERIFY_DIR/Manis Pocket.app/Contents/MacOS/manis-pocket"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$VERIFY_DIR/Manis Pocket.app/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: ManisPocket-macOS
          path: build/ManisPocket.app.zip

  build-linux:
    name: Build Manis Pocket (Linux)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          # No GTK: the tray is a D-Bus status notifier.
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfreetype-dev libvulkan-dev libfontconfig-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p manis-pocket-app

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/manis-pocket dist/
          cp scripts/install-linux.sh dist/
          tar -czf dist/ManisPocket-linux-x86_64.tar.gz -C dist manis-pocket install-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ManisPocket-linux
          path: dist/ManisPocket-linux-x86_64.tar.gz
          if-no-files-found: error

  build-android:
    name: Build Manis Pocket (Android)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build

      - name: Build Rust Android
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            bash scripts/build-rust-android.sh all
          else
            bash scripts/build-rust-android.sh arm64
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android with shared version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PappVersionName="$RELEASE_VERSION" \
            -PappVersionCode="$RELEASE_BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: ManisPocket-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish Release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.version.outputs.publish == 'true'
    needs: [version, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-manis-pocket-releases
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ManisPocket-macOS
      - uses: actions/download-artifact@v4
        with:
          name: ManisPocket-linux
      - uses: actions/download-artifact@v4
        with:
          name: ManisPocket-Android

      - name: Generate matching Sparkle feed
        run: |
          FEED_NAME=appcast.xml
          if [[ "$RELEASE_CHANNEL" == beta ]]; then
            FEED_NAME=appcast-beta.xml
          fi
          mkdir -p release-feed
          python3 scripts/generate-appcast.py \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --archive ManisPocket.app.zip \
            --channel "$RELEASE_CHANNEL" \
            --output "release-feed/$FEED_NAME"

      - name: Publish immutable versioned release
        run: bash scripts/publish-release.sh

      - name: Update channel feed without downgrading
        run: |
          FEED_NAME=appcast.xml
          if [[ "$RELEASE_CHANNEL" == beta ]]; then
            FEED_NAME=appcast-beta.xml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The feed lives on its own branch, so master history stays free of
          # machine commits and a docs push cannot race a feed update. The
          # updater has to be copied out first: the feed branch carries nothing
          # but the two XML files.
          updater="$RUNNER_TEMP/update-appcast.py"
          cp scripts/update-appcast.py "$updater"
          for attempt in 1 2 3; do
            git fetch origin feeds
            git checkout -B publish-feed FETCH_HEAD
            python3 "$updater" \
              --source "release-feed/$FEED_NAME" --destination "$FEED_NAME"
            git add "$FEED_NAME"
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c core.editor=true commit -m "chore(feed): update $RELEASE_CHANNEL feed to $RELEASE_VERSION"
            if git push origin HEAD:refs/heads/feeds; then
              exit 0
            fi
            echo "Feed push attempt $attempt failed; retrying against current feeds"
          done
          echo "Could not publish channel feed after three attempts" >&2
          exit 1
