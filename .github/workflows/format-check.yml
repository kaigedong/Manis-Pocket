name: Format Check

on:
  push:
    branches: [master, feat/p2p-sync, refactor/rust-shared-core, feat/file-sharing]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Check formatting
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust formatting
        run: cargo fmt --check

      # Pinned like ktlint below: `brew install swiftformat` now resolves 0.64,
      # which enables repeatedGuard/nestedIf by default and fails this codebase.
      # Bump the version deliberately and reformat in the same change.
      - name: Check Swift formatting
        env:
          SWIFTFORMAT_VERSION: 0.63.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          swiftformat="$RUNNER_TEMP/swiftformat/swiftformat"
          chmod +x "$swiftformat"
          "$swiftformat" --version
          "$swiftformat" --lint ManisPocket/ ManisPocketTests/ ManisPocketUITests/

      - name: Check Kotlin formatting
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint 'android/**/*.kt' '!android/**/manis_pocket_core.kt'
