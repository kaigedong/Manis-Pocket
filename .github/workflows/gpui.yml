name: GPUI build

# Builds the rewritten (GPUI) desktop app for macOS and Linux. Kept separate from
# build.yml so the shipped SwiftUI/Android release is not disturbed while the
# rewrite is still being finished.
on:
  push:
    branches: [master, feat/gpui-rewrite]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'vendor/**'
      - '.github/workflows/gpui.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo test -p manis-pocket-app
          cargo test -p manis-pocket-core
          cargo test -p manis-pocket-sync --lib

      - name: Build and package
        env:
          PROFILE: release
          # Empty secrets fall back to an ad-hoc signature, which still runs
          # locally but is not distributable.
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
          VERSION: ${{ github.run_number }}
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE_P12 }}" ]; then
            echo "${{ secrets.MACOS_CERTIFICATE_P12 }}" | base64 -d > /tmp/cert.p12
            security create-keychain -p build build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p build build.keychain
            security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          fi
          if [ -n "${{ secrets.MACOS_NOTARY_APPLE_ID }}" ]; then
            xcrun notarytool store-credentials build-notary \
              --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
              --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
              --team-id "${{ secrets.MACOS_TEAM_ID }}"
            export NOTARY_PROFILE=build-notary
          fi
          bash scripts/bundle-macos.sh

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent "build/Manis Pocket.app" build/ManisPocket-gpui-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ManisPocket-gpui-macOS
          path: build/ManisPocket-gpui-macos.zip
          if-no-files-found: error

  linux:
    name: Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libfontconfig-dev libssl-dev pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p manis-pocket-app

      - name: Package
        run: |
          # The installer writes the .desktop file itself, so the archive only
          # needs the binary and the script.
          mkdir -p dist
          cp target/release/manis-pocket dist/
          cp scripts/install-linux.sh dist/
          tar -czf dist/ManisPocket-gpui-linux-x86_64.tar.gz -C dist manis-pocket install-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ManisPocket-gpui-linux
          path: dist/ManisPocket-gpui-linux-x86_64.tar.gz
          if-no-files-found: error

  # Attaches the GPUI builds to the release that the SwiftUI/Android workflow
  # publishes, without touching that pipeline. The rewrite becomes downloadable
  # while the shipped app stays the default download; removing the macOS job from
  # build.yml is all it takes to make this the only macOS build.
  publish:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ManisPocket-gpui-macOS
      - uses: actions/download-artifact@v4
        with:
          name: ManisPocket-gpui-linux

      - name: Wait for the release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Both workflows start on the same tag; the release is created by the
          # other one, so give it a few minutes before giving up.
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG is available"
              exit 0
            fi
            sleep 20
          done
          echo "::error::release $TAG never appeared"
          exit 1

      - name: Upload GPUI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            ManisPocket-gpui-macos.zip \
            ManisPocket-gpui-linux-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
