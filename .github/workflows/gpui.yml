name: GPUI build

# Builds the rewritten (GPUI) desktop app for macOS and Linux. Kept separate from
# build.yml so the shipped SwiftUI/Android release is not disturbed while the
# rewrite is still being finished.
on:
  # master and tag pushes are covered by build.yml, which also packages the
  # release; running here too would build Linux twice for nothing.
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'vendor/**'
      - '.github/workflows/gpui.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: |
          cargo test -p manis-pocket-app
          cargo test -p manis-pocket-core
          cargo test -p manis-pocket-sync --lib

  linux:
    name: Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          # No GTK: the tray on Linux is a D-Bus status notifier (ksni).
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfreetype-dev libvulkan-dev libfontconfig-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p manis-pocket-app

      - name: Package
        run: |
          # The installer writes the .desktop file itself, so the archive only
          # needs the binary and the script.
          mkdir -p dist
          cp target/release/manis-pocket dist/
          cp scripts/install-linux.sh dist/
          tar -czf dist/ManisPocket-linux-x86_64.tar.gz -C dist manis-pocket install-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ManisPocket-linux
          path: dist/ManisPocket-linux-x86_64.tar.gz
          if-no-files-found: error
