name: Publish Arch release and AUR

# Chained off the Arch package build, the same way the Manis repository chains
# its AUR publish off Package. A successful release therefore attaches the Linux
# package to the product release and updates AUR without a manual dispatch.
#
# The Linux package is not a release of its own: it reuses the product version
# and the `build-*` GitHub release of the same commit, so one release carries
# one version and one asset set for macOS, Android and Linux. Users only ever
# see the single AUR package name `manis-pocket-bin`.
#
# The upstream run's head_sha is the source of truth for the checkout, the
# version and the release target: the Build and Release workflow commits an
# appcast update to master after each release, so the branch tip is usually NOT
# the commit that was packaged.

on:
  workflow_run:
    workflows:
      - Arch Linux package
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-manis-pocket-aur
  cancel-in-progress: false

jobs:
  release:
    name: Attach Linux package to the product release
    # Arch CI is now chained off Build and Release, so its own run reports
    # `workflow_run`. Pull-request builds of Arch CI report `pull_request` and
    # are dropped here; the release tag check below covers the rest.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pkgver: ${{ steps.release.outputs.pkgver }}
      sha256: ${{ steps.release.outputs.sha256 }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify Arch CI run and download package
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH_RUN_ID: ${{ github.event.workflow_run.id }}
          ARCH_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [[ ! "$ARCH_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'workflow_run payload is missing the Arch CI run ID' >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARCH_RUN_ID")"
          if [[ "$(jq -r .name <<< "$run_json")" != 'Arch Linux package' ||
                "$(jq -r .event <<< "$run_json")" != 'workflow_run' ||
                "$(jq -r .head_sha <<< "$run_json")" != "$ARCH_SHA" ||
                "$(jq -r .conclusion <<< "$run_json")" != 'success' ]]; then
            echo 'Arch CI run is not a successful release build for this commit' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$ARCH_SHA" ]]; then
            echo 'checkout does not match the packaged Arch CI commit' >&2
            exit 1
          fi

          pkgver="$(bash packaging/package-version.sh)"
          # The Linux package carries the same product version as the
          # macOS/Android artifacts of this commit, so require the matching
          # Build and Release tag to exist on the packaged commit. Without it
          # the number below would be an unreleased placeholder.
          if [[ ! "$pkgver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package version '$pkgver' is not a product release version" >&2
            exit 1
          fi
          git fetch --tags --force --quiet origin '+refs/tags/*:refs/tags/*'
          release_version_tag=""
          for candidate in "build-$pkgver" "v$pkgver"; do
            if [[ "$(git rev-parse --verify --quiet "refs/tags/$candidate^{commit}" || true)" == "$ARCH_SHA" ]]; then
              release_version_tag="$candidate"
              break
            fi
          done
          if [[ -z "$release_version_tag" ]]; then
            echo "no release tag for version $pkgver on $ARCH_SHA" >&2
            exit 1
          fi
          asset_name="manis-pocket-${pkgver}-1-x86_64.pkg.tar.zst"
          gh run download "$ARCH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name manis-pocket-arch-x86_64 \
            --dir dist
          test -f "dist/$asset_name"
          (cd dist && sha256sum --check "$asset_name.sha256")
          digest="$(sha256sum "dist/$asset_name" | cut -d ' ' -f1)"

          # Build and Release publishes its release once the macOS and Android
          # builds pass, which can land after this job starts. Attach to the
          # published release so the asset URL in the AUR recipe is live.
          published=false
          for attempt in $(seq 1 30); do
            is_draft="$(gh release view "$release_version_tag" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$is_draft" == 'false' ]]; then
              published=true
              break
            fi
            echo "Release $release_version_tag is not published yet (attempt $attempt/30); waiting"
            sleep 20
          done
          if [[ "$published" != true ]]; then
            echo "release $release_version_tag was not published in time" >&2
            exit 1
          fi

          remote_digest="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_version_tag" \
              --jq ".assets[] | select(.name == \"$asset_name\") | .digest"
          )"
          if [[ -n "$remote_digest" ]]; then
            if [[ "$remote_digest" != "sha256:$digest" ]]; then
              echo 'existing release asset differs from the verified Arch CI package' >&2
              exit 1
            fi
          else
            gh release upload "$release_version_tag" \
              "dist/$asset_name" "dist/$asset_name.sha256" \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_version_tag" >> "$GITHUB_OUTPUT"

  aur:
    name: Publish manis-pocket-bin
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AUR SSH identity
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'AUR_SSH_PRIVATE_KEY is not configured in Manis-Pocket' >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 0600 "$HOME/.ssh/aur"
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$HOME/.ssh/known_hosts"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Render AUR metadata
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
          PKGVER: ${{ needs.release.outputs.pkgver }}
          PACKAGE_SHA256: ${{ needs.release.outputs.sha256 }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        shell: bash
        run: |
          aur_dir="$RUNNER_TEMP/manis-pocket-bin"
          git clone ssh://aur@aur.archlinux.org/manis-pocket-bin.git "$aur_dir"
          bash packaging/aur/render-pkgbuild.sh \
            "$PKGVER" "$PACKAGE_SHA256" "$aur_dir" "$RELEASE_TAG"
          docker run --rm \
            --platform linux/amd64 \
            -v "$aur_dir:/aur:ro" \
            archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f \
            bash -lc '
              useradd --create-home builder
              cp -a /aur /home/builder/package
              chown -R builder:builder /home/builder/package
              runuser -u builder -- bash -lc "cd ~/package && makepkg --printsrcinfo"
            ' > "$aur_dir/.SRCINFO"
          grep -Fx "$(printf '\tpkgver = %s' "$PKGVER")" "$aur_dir/.SRCINFO"

      - name: Push AUR package
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/manis-pocket-bin"
          git config user.name 'Manis Pocket release automation'
          git config user.email 'bobosingle@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR package is already current'
            exit 0
          fi
          git commit -m "Update to $(sed -n 's/^pkgver=//p' PKGBUILD)"
          git push origin HEAD:master
