[package]
name = "manis-pocket-app"
description = "GPUI desktop app for Manis Pocket (macOS + Linux)"
edition.workspace = true
version = "0.1.0"

[[bin]]
name = "manis-pocket"
path = "src/main.rs"

[dependencies]
# Parsing the core's peer list and the legacy history file.
serde_json = "1"
gpui-kit = "0.9.1"
manis-pocket-core = { path = "../manis-pocket-core" }
dirs = "6"
chrono = "0.4"
log = "0.4"
arboard = "3"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
global-hotkey = "0.10.0"
image = "0.25.10"
env_logger = "0.11.11"
regex = "1.13.1"

[target.'cfg(target_os = "linux")'.dependencies]
# A pure D-Bus status notifier: no GTK anywhere in the Linux build.
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26.1"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSResponder",
    "NSScreen",
    "NSPasteboard",
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImageRep",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData", "NSDictionary"] }
